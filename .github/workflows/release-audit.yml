name: Release Audit & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    # The Doppler tools resolve the lock's doppler.development.workspacePath
    # (../doppler) from the repository root, so Simulatte and Doppler are
    # checked out side by side inside the workspace.
    defaults:
      run:
        working-directory: simulatte
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: simulatte

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve pinned Doppler source
        id: doppler-pin
        run: |
          node -e '
            const { development } = require("./public/data/simulatte-embedder/model-runtime-lock.json").doppler;
            if (development.workspacePath !== "../doppler") throw new Error(`CI checks Doppler out at ../doppler; the lock declares ${development.workspacePath}`);
            console.log(`sha=${development.gitSha}`);
          ' >> "$GITHUB_OUTPUT"

      # restore:doppler:development and check:deploy archive this exact commit.
      - name: Checkout pinned Doppler source
        uses: actions/checkout@v7
        with:
          repository: clocksmith/doppler
          ref: ${{ steps.doppler-pin.outputs.sha }}
          path: doppler

      - name: Setup classifier generator Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: simulatte/tools/samer/requirements-compact-classifiers.txt

      - name: Install pinned classifier generator
        run: python -m pip install -r tools/samer/requirements-compact-classifiers.txt

      - name: Restore pinned browser runtime
        run: npm run restore:doppler:development

      # The rest of check:fast runs below: its test files in `npm test`, and its
      # entrypoint and artifact-inventory checks in `check:deploy`.
      - name: Run fast deterministic checks
        run: npm run catscan:check && npm run folder-contracts:ci && npm run check:source-size && npm run check:pipeline-map

      - name: Enforce shared World UI ownership
        run: npm run check:world-ui

      - name: Run unit and contract test suite
        run: npm test

      # check:deploy also runs plugins:check.
      - name: Run deploy surface checks
        run: npm run check:deploy

      - name: Run place-resolution performance budget (Chrome with WebGPU)
        run: npm run check:place-performance

      - name: Verify clean generated state and diff hygiene
        run: git diff --exit-code && git diff --check
