name: Release Audit & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup classifier generator Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tools/samer/requirements-compact-classifiers.txt

      - name: Install pinned classifier generator
        run: python -m pip install -r tools/samer/requirements-compact-classifiers.txt

      - name: Run fast deterministic checks
        run: npm run check:fast

      - name: Verify plugin boundaries and generated registry
        run: npm run plugins:check

      - name: Run unit and contract test suite
        run: npm test

      - name: Run deploy surface checks
        run: npm run check:deploy

      - name: Verify clean generated state and diff hygiene
        run: git diff --exit-code && git diff --check
