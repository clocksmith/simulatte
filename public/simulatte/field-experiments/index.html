<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simulatte experiment</title>
    <meta name="simulatte-build" content="7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753">
    <base href="/simulatte/field-experiments/" />
    <link rel="stylesheet" href="../../shared/design/tokens.css?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753" />
    <link rel="stylesheet" href="../../shared/design/themes/world.css?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753" />
    <link rel="stylesheet" href="./experiment.css?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753" />
  </head>
  <body>
    <header>
      <a href="../../">SIMULATTE</a>
      <h1 id="title">Loading experiment</h1>
      <button id="theme" type="button">Theme</button>
    </header>
    <main>
      <p id="question"></p>
      <div class="toolbar primary-toolbar"><button id="pause">Pause</button><button id="restart">Restart</button><button id="signal" aria-pressed="true">Signal exchange</button><output id="clock"></output></div>
      <p id="legend" class="legend"><span>Green: growing</span><span>Blue: growth limited</span><span>Gold: source and signal exchange</span><span>Outline: selected lineage</span></p>
      <div class="experiments">
        <section>
          <h2>Selected experiment</h2>
          <canvas
            id="scene"
            tabindex="0"
            aria-label="Select an object in the simulation"
          ></canvas>
        </section>
        <section>
          <h2>Untouched baseline</h2>
          <canvas
            id="baseline"
            aria-label="Same initial conditions without interventions"
          ></canvas>
        </section>
      </div>
      <dl id="measures"></dl>
      <aside>
        <h2 id="selection">Selected object</h2>
        <p id="condition"></p>
        <div id="actions"></div>
        <p id="preview-description"></p>
        <p id="consequence" aria-live="polite"></p>
      </aside>
      <details>
        <summary>Advanced: replay, files and evidence</summary>
        <div class="toolbar"><button id="replay">Replay actions</button><label>Playback <select id="speed"><option value="1">1×</option><option value="4">4×</option></select></label><button id="export">Export run</button><label class="import-button">Import run<input id="import" type="file" accept="application/json"></label></div>
        <p id="boundary"></p>
        <dl id="checks"></dl>
        <div id="sources"></div>
        <textarea id="spec" aria-label="WorldSpec" readonly></textarea>
      </details>
      <p id="status" role="status"></p>
    </main>
    <script defer src="../../simulation-routes.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="../../shared/design/theme-controller.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script
      defer
      src="../../shared/contracts/world-spec-authorship.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"
    ></script>
    <script defer src="../../shared/contracts/world-spec.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="../../shared/core/simulation/field-grid.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="../../shared/core/simulation/tissue-growth.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="../../shared/core/simulation/river-erosion.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script
      defer
      src="../../shared/core/simulation/crystal-solidification.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"
    ></script>
    <script defer src="./program.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="./drawing.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
    <script defer src="./app.js?v=7aa0bd1b3c9ca2e06dde60e1fca07689b0ad5cbe-7df25bd07753"></script>
  </body>
</html>
