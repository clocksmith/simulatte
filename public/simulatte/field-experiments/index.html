<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simulatte experiment</title>
    <meta name="simulatte-build" content="23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049">
    <base href="/simulatte/field-experiments/" />
    <link rel="stylesheet" href="../../shared/design/tokens.css?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049" />
    <link rel="stylesheet" href="../../shared/design/themes/world.css?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049" />

  <link rel="stylesheet" href="../../shared/design/components.css?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049">
</head>
  <body>
    <header>
      <a href="../../">SIMULATTE</a>
      <h1 id="title">Loading experiment</h1>
      <button id="theme" type="button">Theme</button>
    </header>
    <main>
      <p id="question"></p>
      <div class="toolbar primary-toolbar"><button id="pause">Pause</button><button id="restart">Restart</button><label class="sim-switch"><input id="signal" type="checkbox" role="switch" checked>Show signal field</label><button id="reset-view">Reset view</button><button id="replay">Replay</button><label>Speed <select id="speed"><option value="1">1×</option><option value="4">4×</option></select></label><output id="clock"></output></div>
      <p><output id="playback-rate"></output> <span id="playback-health" role="status"></span></p>
      <div id="camera-views" data-control-choice role="radiogroup" aria-label="Camera view"><button data-view="overview" aria-checked="true">Overview</button><button data-view="top" aria-checked="false">Top</button></div>
      <p id="legend" class="legend"><span>Green: growing</span><span>Blue: growth limited</span><span>Gold: source and signal exchange</span><span>Outline: selected lineage</span></p>
      <div class="experiments">
        <section>
          <h2>Selected experiment</h2>
          <canvas
            id="scene"
            tabindex="0"
            aria-label="Select an object in the simulation"
          ></canvas>
        </section>
        <section>
          <h2>Untouched baseline</h2>
          <canvas
            id="baseline"
            aria-label="Same initial conditions without interventions"
          ></canvas>
        </section>
      </div>
      <dl id="measures"></dl>
      <aside>
        <h2 id="selection">Selected object</h2>
        <p id="condition"></p>
        <div id="actions"></div><button id="focus-selection">Focus selection</button>
        <p id="preview-description"></p>
        <p id="consequence" aria-live="polite"></p>
      </aside>
      <details>
        <summary>Advanced: replay, files and evidence</summary>
        <div class="toolbar"><button id="verify-replay">Verify replay</button><button id="export">Export run</button><label class="import-button">Import run<input id="import" type="file" accept="application/json"></label></div>
        <p id="boundary"></p>
        <dl id="checks"></dl>
        <div id="sources"></div>
        <textarea id="spec" aria-label="WorldSpec" readonly></textarea>
      </details>
      <p id="status" role="status"></p>
    </main>
    <script defer src="../../simulation-routes.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>
    <script defer src="../../shared/design/theme-controller.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>

    <script defer src="../../shared/core/simulation/field-grid.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>
    <script defer src="../../shared/core/simulation/tissue-growth.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>

    <script defer src="./drawing.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>
    <script defer src="./app.js?v=23b30ef99be73dc8e2eb9ff9630f96f6c0c51756-fd2fd6779049"></script>
